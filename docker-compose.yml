services:
  pos_app:
    build: ./app
    container_name: pos_app
    restart: unless-stopped
    environment:
      DB_HOST: mysql_db
      DB_PORT: 3306
      DB_NAME: pos_db
      DB_USER: ${DB_USER:-pos_user}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}
    depends_on:
      mysql_db:
        condition: service_healthy
    networks: [pos_internal, monitoring]
    volumes:
      - app_logs:/var/log/pos
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  mysql_db:
    image: mysql:8.4
    container_name: pos_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pos_db
      MYSQL_USER: ${DB_USER:-pos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./logs/mysql:/var/log/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [pos_internal]
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.28-alpine
    container_name: pos_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on: [pos_app]
    networks: [pos_internal, public_net]
    security_opt:
      - no-new-privileges:true

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    container_name: pos_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql_db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "8081:80"
    depends_on:
      mysql_db:
        condition: service_healthy
    networks: [pos_internal, public_net]
    profiles: ["admin"]
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pos_prometheus
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [monitoring]
    depends_on: [pos_app, cadvisor, node_exporter]
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.1.0
    container_name: pos_grafana
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [monitoring]
    depends_on: [prometheus, loki]
    security_opt:
      - no-new-privileges:true

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: pos_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks: [monitoring]

  node_exporter:
    image: prom/node-exporter:v1.9.1
    container_name: pos_node_exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave
    networks: [monitoring]

  loki:
    image: grafana/loki:3.5.3
    container_name: pos_loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks: [monitoring]
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.5.3
    container_name: pos_promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - nginx_logs:/var/log/nginx:ro
      - app_logs:/var/log/pos:ro
      - promtail_positions:/tmp
    networks: [monitoring]
    depends_on: [loki]

networks:
  public_net:
  pos_internal:
    internal: true
  monitoring:

volumes:
  mysql_data:
  nginx_logs:
  app_logs:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
